stages:
  - build
  - release

variables:
  AHK_VERSION: "2.0.18"

compile:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - |
      $ErrorActionPreference = "Stop"

      # AutoHotkey v2 herunterladen (Base-Exe)
      Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip" -OutFile "ahk.zip"
      Expand-Archive -Path "ahk.zip" -DestinationPath "ahk"

      # Ahk2Exe Compiler separat herunterladen
      Invoke-WebRequest -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip" -OutFile "ahk2exe.zip"
      Expand-Archive -Path "ahk2exe.zip" -DestinationPath "ahk2exe"
      Get-ChildItem -Path "ahk2exe" -Recurse | Select-Object Name

      # Kompilieren
      & .\ahk2exe\Ahk2Exe.exe /in AutoReSizer.ahk /out AutoReSizer.exe /icon icons\icon.ico /base ahk\AutoHotkey64.exe
      Start-Sleep -Seconds 3
      if (-not (Test-Path "AutoReSizer.exe")) { Write-Error "Kompilierung fehlgeschlagen"; exit 1 }
      Write-Output "AutoReSizer.exe erfolgreich erstellt ($(( Get-Item AutoReSizer.exe).Length / 1KB) KB)"

      # Release-ZIP erstellen
      New-Item -ItemType Directory -Path "AutoReSizer" -Force
      Copy-Item -Path "AutoReSizer.exe" -Destination "AutoReSizer\"
      Copy-Item -Path "AutoReSizer.dll" -Destination "AutoReSizer\"
      Copy-Item -Path "readme.txt" -Destination "AutoReSizer\"
      Copy-Item -Path "license.txt" -Destination "AutoReSizer\"
      Copy-Item -Path "Deutsch.lng" -Destination "AutoReSizer\"
      Copy-Item -Path "English.lng" -Destination "AutoReSizer\"
      Write-Output "ZIP-Inhalt:"
      Get-ChildItem -Path "AutoReSizer\" | Format-Table Name, Length
      Compress-Archive -Path "AutoReSizer\*" -DestinationPath "AutoReSizer_$env:CI_COMMIT_TAG.zip"
      Write-Output "AutoReSizer_$env:CI_COMMIT_TAG.zip erstellt"
  artifacts:
    paths:
      - "AutoReSizer_*.zip"
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: compile
      artifacts: true
  script:
    - echo "Release ${CI_COMMIT_TAG} erstellen"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "AutoReSizer ${CI_COMMIT_TAG}"
    description: "AutoReSizer ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "AutoReSizer_${CI_COMMIT_TAG}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/AutoReSizer_${CI_COMMIT_TAG}.zip?job=compile"
  rules:
    - if: $CI_COMMIT_TAG
