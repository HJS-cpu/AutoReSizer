stages:
  - build
  - release

variables:
  AHK_VERSION: "2.0.18"

compile:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - |
      Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip" -OutFile "ahk.zip"
      Expand-Archive -Path "ahk.zip" -DestinationPath "ahk"
      Get-ChildItem -Path "ahk" -Recurse | Select-Object FullName
      $compiler = Get-ChildItem -Path "ahk" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
      if (-not $compiler) { throw "Ahk2Exe.exe nicht gefunden" }
      Write-Output "Compiler gefunden: $compiler"
      $base = Get-ChildItem -Path "ahk" -Recurse -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
      & $compiler /in AutoReSizer.ahk /out AutoReSizer.exe /icon icons\icon.ico /base $base
      if (-not (Test-Path "AutoReSizer.exe")) { throw "Kompilierung fehlgeschlagen" }
      Write-Output "AutoReSizer.exe erfolgreich erstellt"
  artifacts:
    paths:
      - AutoReSizer.exe
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: compile
      artifacts: true
  script:
    - echo "Release ${CI_COMMIT_TAG} erstellen"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "AutoReSizer ${CI_COMMIT_TAG}"
    description: "AutoReSizer ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "AutoReSizer.exe"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/AutoReSizer.exe"
  rules:
    - if: $CI_COMMIT_TAG
